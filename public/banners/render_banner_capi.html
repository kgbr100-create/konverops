<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; background: transparent; }
  </style>
</head>
<body class="w-[640px] h-[192px] overflow-hidden flex items-center justify-center p-0">
  <div class="relative w-full h-full rounded-[32px] bg-gradient-to-r from-[#1c083d] via-[#311165] to-[#4c1c96] shadow-2xl overflow-hidden flex">
    <!-- Ambient Radial Glow -->
    <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-purple-400/25 rounded-full blur-2xl pointer-events-none"></div>

    <!-- 3D Shield Badge (Top Right) -->
    <div class="absolute top-4 right-5 w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-300 shadow-xl shadow-black/40 flex items-center justify-center text-slate-950 font-black text-xl ring-2 ring-white/60 z-20">
      🛡️
    </div>

    <!-- Cutout Image Analytics (Left) -->
    <div class="relative w-[220px] h-full flex-shrink-0 z-10">
      <img 
        src="assets/analytics_dashboard.jpg" 
        alt="Meta CAPI" 
        class="absolute bottom-0 left-0 h-full w-full object-cover filter contrast-115"
        style="mask-image: linear-gradient(to right, black 65%, transparent 100%); -webkit-mask-image: linear-gradient(to right, black 65%, transparent 100%);"
      />
    </div>

    <!-- Content (Right) -->
    <div class="flex-1 py-5 pr-6 pl-2 flex flex-col justify-between z-10 text-white">
      <div>
        <span class="text-xs uppercase tracking-widest text-purple-200 font-bold block leading-none mb-1.5">
          100% First-Party
        </span>
        <h2 class="text-2xl font-black text-white leading-tight tracking-tight">
          Meta CAPI Server-Side
        </h2>
        <p class="text-xs text-purple-100/90 leading-snug mt-1 font-medium max-w-[340px]">
          Blindagem contra perda de dados nas suas campanhas de mídia paga.
        </p>
      </div>

      <div class="pt-2">
        <span class="inline-flex items-center gap-1.5 px-5 py-2 rounded-full bg-white text-[#1c083d] font-black text-xs uppercase tracking-wider shadow-lg shadow-black/20">
          Conhecer Método
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/>
          </svg>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
