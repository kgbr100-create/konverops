<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; background: transparent; }
  </style>
</head>
<body class="w-[640px] h-[192px] overflow-hidden flex items-center justify-center p-0">
  <div class="relative w-full h-full rounded-[32px] bg-gradient-to-r from-[#2c1c05] via-[#482e09] to-[#6d460d] shadow-2xl overflow-hidden flex">
    <!-- Ambient Radial Glow -->
    <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-amber-400/25 rounded-full blur-2xl pointer-events-none"></div>

    <!-- 3D Star Badge (Top Right) -->
    <div class="absolute top-4 right-5 w-12 h-12 rounded-full bg-gradient-to-tr from-amber-300 to-yellow-100 shadow-xl shadow-black/40 flex items-center justify-center text-slate-950 font-black text-xl ring-2 ring-white/60 z-20">
      ★
    </div>

    <!-- Cutout Portrait (Left) -->
    <div class="relative w-[220px] h-full flex-shrink-0 z-10">
      <img 
        src="assets/founder_portrait.jpg" 
        alt="Kelvin Gonzaga" 
        class="absolute bottom-0 left-0 h-full w-full object-cover object-top filter contrast-105"
        style="mask-image: linear-gradient(to right, black 65%, transparent 100%); -webkit-mask-image: linear-gradient(to right, black 65%, transparent 100%);"
      />
    </div>

    <!-- Content (Right) -->
    <div class="flex-1 py-5 pr-6 pl-2 flex flex-col justify-between z-10 text-white">
      <div>
        <span class="text-xs uppercase tracking-widest text-amber-200 font-bold block leading-none mb-1.5">
          Ultra Performance
        </span>
        <h2 class="text-2xl font-black text-white leading-tight tracking-tight">
          Infraestrutura Konverops
        </h2>
        <p class="text-xs text-amber-100/90 leading-snug mt-1 font-medium max-w-[340px]">
          +R$ 1.5M em mídia gerida com carregamento sub-300ms.
        </p>
      </div>

      <div class="pt-2">
        <span class="inline-flex items-center gap-1.5 px-5 py-2 rounded-full bg-gradient-to-r from-amber-200 via-yellow-200 to-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-black/20">
          Acessar Site
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
