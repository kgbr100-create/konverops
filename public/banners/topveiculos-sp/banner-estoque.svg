<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192" width="640" height="192">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="640" height="192" rx="16" fill="url(#bg1)" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="0" y="0" width="8" height="192" rx="4" fill="url(#redAccent)"/>
  
  <!-- Car silhouette / sport lines -->
  <g opacity="0.12" transform="translate(420, 20)">
    <path d="M40 70 L80 35 L160 35 L190 70 L210 75 L210 110 L190 110 A 20 20 0 0 1 150 110 L80 110 A 20 20 0 0 1 40 110 L10 110 L10 85 Z" fill="#ffffff"/>
    <circle cx="60" cy="110" r="16" fill="#ffffff"/>
    <circle cx="170" cy="110" r="16" fill="#ffffff"/>
  </g>

  <!-- Content -->
  <g transform="translate(36, 42)">
    <rect x="0" y="0" width="130" height="22" rx="6" fill="#e11d48" fill-opacity="0.18"/>
    <text x="8" y="15" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEMINOVOS &amp; BLINDADOS</text>
    <text x="0" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Consultar Estoque de Veículos</text>
    <text x="0" y="78" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Mais de 40 modelos com laudo cautelar aprovado e garantia</text>
    <g transform="translate(0, 94)">
      <rect width="138" height="28" rx="6" fill="url(#redAccent)" filter="url(#glow)"/>
      <text x="14" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Ver Estoque →</text>
    </g>
  </g>
</svg>
