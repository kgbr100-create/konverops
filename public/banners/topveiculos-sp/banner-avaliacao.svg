    <text x="0" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Avaliação do seu Usado na Troca</text>
    <text x="0" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Pagamento à vista na compra ou máxima valorização como entrada</text>
    <g transform="translate(0, 94)">
